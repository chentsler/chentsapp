<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow emoji status</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff);
         color: var(--tg-theme-text-color, #000); padding: 16px; box-sizing: border-box; text-align: center; }
  .card { max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--tg-theme-hint-color, #777); line-height: 1.4; }
  button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px; font-size: 16px;
           background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
</style>
</head>
<body>
<div class="card">
  <h1 id="t">🔑 Allow emoji status</h1>
  <p id="m">Confirm the permission so the bot can rotate the emoji status next to your name.</p>
  <button id="b">Allow access</button>
</div>
<script>
  const tg = window.Telegram.WebApp, t = document.getElementById('t'), m = document.getElementById('m'), b = document.getElementById('b');
  tg.ready(); tg.expand();
  function ask() {
    if (!tg.requestEmojiStatusAccess) { t.textContent = '⚠️ Update Telegram'; m.textContent = 'This Telegram version is too old for emoji status access.'; return; }
    tg.requestEmojiStatusAccess(function (ok) {
      if (ok) { t.textContent = '✅ Access granted'; m.textContent = 'Go back to the bot and tap ▶️ Start.'; b.textContent = 'Close'; b.onclick = () => tg.close(); setTimeout(() => tg.close(), 1500); }
      else { t.textContent = '❌ Not allowed'; m.textContent = 'Without the permission the carousel cannot change your status. Tap the button to try again.'; }
    });
  }
  b.onclick = ask; ask();
</script>
</body>
</html>
